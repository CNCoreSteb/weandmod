name: Build Windows

on:
  push:
    tags: ['v*'] # 只在版本 tag 推送时打包发 Release
  workflow_dispatch: # 保留手动触发(产物为 dev-<sha> 版本)

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify C toolchain
        run: gcc --version

      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $v = 'dev-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Mode Release -Out WeAndMod.exe -Version $env:APP_VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: WeAndMod-windows-amd64
          path: WeAndMod.exe
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WeAndMod.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
